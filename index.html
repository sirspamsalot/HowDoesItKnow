<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shabbat Countdown</title>
<meta name="description" content="A live countdown to candle lighting wherever you are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --text:#e9e6df;
    --muted:#8d8a84;
    --led:#ff3b2f;
    --led-glow:rgba(255,59,47,.6);
    --led-off:rgba(255,59,47,.07);
    --dw:clamp(26px,8vw,78px); /* digit width */
  }
  :root.shabbat{
    --led:#ffb53d;
    --led-glow:rgba(255,181,61,.55);
    --led-off:rgba(255,181,61,.07);
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    background-color:var(--bg);
    background-image:radial-gradient(ellipse at 50% 30%,#1c1c21 0%,var(--bg) 70%);
    color:var(--text);
    font-family:'Oswald',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px 16px;
  }
  main{width:100%;max-width:980px;text-align:center}
  .eyebrow{
    letter-spacing:.35em;text-transform:uppercase;
    font-size:clamp(14px,2.2vw,20px);color:var(--muted);margin-bottom:22px;
  }
  .panel{
    display:inline-block;max-width:100%;
    background:linear-gradient(#19191d,#0d0d10);
    border:1px solid #2c2c32;border-radius:14px;
    padding:clamp(16px,3.5vw,42px) clamp(10px,3vw,42px) clamp(12px,2.5vw,28px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.04),
               inset 0 -24px 48px rgba(0,0,0,.65),
               0 30px 60px rgba(0,0,0,.6);
  }
  .clock{display:flex;align-items:flex-start;justify-content:center;gap:clamp(4px,1.2vw,14px)}
  .group{display:flex;flex-direction:column;align-items:center}
  .digits{display:flex;gap:clamp(2px,.6vw,8px)}
  .digit{width:var(--dw);height:auto;display:block;overflow:visible;
         filter:drop-shadow(0 0 5px var(--led-glow))}
  .digit polygon{fill:var(--led-off);transition:fill .06s}
  .digit polygon.on{fill:var(--led)}
  .colon{
    height:calc(var(--dw) * 1.528);
    display:flex;flex-direction:column;justify-content:center;
    gap:calc(var(--dw) * .42);
  }
  .colon i{
    display:block;width:calc(var(--dw) * .15);aspect-ratio:1;border-radius:2px;
    background:var(--led);box-shadow:0 0 8px var(--led-glow);transition:opacity .15s;
  }
  .colon.dim i{opacity:.2}
  .label{
    margin-top:12px;font-size:clamp(10px,1.6vw,16px);
    letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
  }
  .where{margin-top:30px;font-size:clamp(18px,3vw,28px);font-weight:600;letter-spacing:.04em}
  .when{margin-top:8px;color:var(--muted);font-size:clamp(13px,1.8vw,16px);letter-spacing:.04em}
  .quote{margin:34px auto 0;max-width:34em;width:fit-content;font-family:Georgia,'Times New Roman',serif;
         font-style:italic;font-size:clamp(15px,2vw,19px);line-height:1.5;color:#c9c5bc}
  .quote cite{display:block;margin-top:6px;text-align:right;font-style:normal;font-family:'Oswald',system-ui,sans-serif;
              font-size:14px;letter-spacing:.12em;color:var(--muted)}
  .source{margin-top:18px;color:#6b6964;font-size:12px;letter-spacing:.05em;font-family:system-ui,sans-serif}
  .source button{
    background:none;border:0;padding:0;color:#a9a59d;text-decoration:underline;
    font:inherit;cursor:pointer;
  }
  .source button:hover{color:var(--text)}
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="headline">Shabbat begins in</p>
  <div class="panel">
    <div class="clock" id="clock">
      <div class="group"><div class="digits" data-unit="days"></div><span class="label">Days</span></div>
      <div class="colon"><i></i><i></i></div>
      <div class="group"><div class="digits" data-unit="hours"></div><span class="label">Hours</span></div>
      <div class="colon"><i></i><i></i></div>
      <div class="group"><div class="digits" data-unit="minutes"></div><span class="label">Minutes</span></div>
      <div class="colon"><i></i><i></i></div>
      <div class="group"><div class="digits" data-unit="seconds"></div><span class="label">Seconds</span></div>
    </div>
  </div>
  <p class="where" id="where">Finding your location…</p>
  <p class="when" id="when"></p>
  <blockquote class="quote">“Time flies like an arrow, fruit flies like a banana.”<cite>— GMarx</cite></blockquote>
  <p class="source"><span id="source"></span> <button id="geoBtn" type="button">Use precise location</button></p>
</main>

<script>
(() => {
  'use strict';

  /* ---------- settings (overridable via URL: ?b=18&lat=..&lon=..&tz=..&name=..) ---------- */
  const qs = new URLSearchParams(location.search);
  const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
  const CANDLE_MIN = num(qs.get('b'), 18);     // minutes before sunset
  const HAVDALAH_FALLBACK_MIN = 42;           // used only if Hebcal is unreachable
  const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

  /* ---------- seven-segment digits ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const H = (cy, x1 = 9, x2 = 51) =>
    `${x1},${cy} ${x1+5},${cy-5} ${x2-5},${cy-5} ${x2},${cy} ${x2-5},${cy+5} ${x1+5},${cy+5}`;
  const V = (cx, y1, y2) =>
    `${cx},${y1} ${cx+5},${y1+5} ${cx+5},${y2-5} ${cx},${y2} ${cx-5},${y2-5} ${cx-5},${y1+5}`;
  const SEGS = { a: H(6), b: V(54, 9, 52), c: V(54, 58, 101), d: H(104),
                 e: V(6, 58, 101), f: V(6, 9, 52), g: H(55) };
  const MAP = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];

  function makeDigit() {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 72 110');
    svg.setAttribute('class', 'digit');
    svg.setAttribute('aria-hidden', 'true');
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', 'translate(10 0) skewX(-6)');
    const polys = Object.entries(SEGS).map(([k, pts]) => {
      const p = document.createElementNS(NS, 'polygon');
      p.setAttribute('points', pts);
      p.dataset.s = k;
      g.appendChild(p);
      return p;
    });
    svg.appendChild(g);
    let cur = null;
    svg.show = n => {
      if (n === cur) return;
      cur = n;
      const on = n == null ? '' : MAP[n];
      polys.forEach(p => p.classList.toggle('on', on.includes(p.dataset.s)));
    };
    return svg;
  }

  const groups = {};
  document.querySelectorAll('.digits').forEach(el => {
    const ds = [makeDigit(), makeDigit()];
    ds.forEach(d => el.appendChild(d));
    groups[el.dataset.unit] = ds;
  });
  const setGroup = (unit, val) => {
    const v = Math.max(0, Math.min(99, val));
    groups[unit][0].show(Math.floor(v / 10));
    groups[unit][1].show(v % 10);
  };
  const blank = () => Object.values(groups).flat().forEach(d => d.show(null));
  blank();

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);

  async function fetchJSON(url, ms = 7000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  function validTz(tz) {
    if (!tz) return null;
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return tz; } catch { return null; }
  }

  function tzDateParts(date, tz) {
    const parts = {};
    new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric' })
      .formatToParts(date).forEach(p => { parts[p.type] = +p.value; });
    return addDays({ y: parts.year, m: parts.month, d: parts.day }, 0);
  }

  function addDays(t, k) {
    const dt = new Date(Date.UTC(t.y, t.m - 1, t.d + k));
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), wd: dt.getUTCDay() };
  }

  const weekdayOfISO = s => {
    const [y, m, d] = s.slice(0, 10).split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  };

  /* ---------- location: IP lookup with fallbacks ---------- */
  async function locateByIP() {
    const label = (...xs) => xs.filter(Boolean).join(', ');
    const providers = [
      async () => {
        const r = await fetchJSON('https://ipapi.co/json/');
        if (r.error) throw new Error(r.reason);
        return { lat: +r.latitude, lon: +r.longitude, tz: r.timezone,
                 label: label(r.city, r.region, r.country_name) };
      },
      async () => {
        const r = await fetchJSON('https://ipwho.is/');
        if (!r.success) throw new Error(r.message);
        return { lat: +r.latitude, lon: +r.longitude, tz: r.timezone && r.timezone.id,
                 label: label(r.city, r.region, r.country) };
      },
      async () => {
        const r = await fetchJSON('https://get.geojs.io/v1/ip/geo.json');
        return { lat: +r.latitude, lon: +r.longitude, tz: r.timezone,
                 label: label(r.city, r.region, r.country) };
      }
    ];
    for (const p of providers) {
      try {
        const loc = await p();
        if (Number.isFinite(loc.lat) && Number.isFinite(loc.lon)) {
          loc.tz = validTz(loc.tz) || browserTz;
          loc.label = loc.label || `${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}`;
          loc.method = 'ip';
          return loc;
        }
      } catch (e) { /* try next provider */ }
    }
    return null;
  }

  function locateFromURL() {
    const lat = parseFloat(qs.get('lat')), lon = parseFloat(qs.get('lon'));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    return { lat, lon, tz: validTz(qs.get('tz')) || browserTz,
             label: qs.get('name') || `${lat.toFixed(3)}, ${lon.toFixed(3)}`, method: 'url' };
  }

  function locateByDevice() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('unsupported'));
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, tz: browserTz,
                         label: 'Your current location', method: 'device' }),
        reject, { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
    });
  }

  /* ---------- zmanim: Hebcal first, local sunset math as fallback ---------- */
  async function hebcalWindow(loc, now) {
    let day = tzDateParts(now, loc.tz);
    for (let i = 0; i < 3; i++) {
      const url = 'https://www.hebcal.com/shabbat?cfg=json&geo=pos' +
        `&latitude=${loc.lat}&longitude=${loc.lon}&tzid=${encodeURIComponent(loc.tz)}` +
        `&M=on&b=${CANDLE_MIN}&gy=${day.y}&gm=${day.m}&gd=${day.d}`;
      const j = await fetchJSON(url);
      const items = j.items || [];
      const candles = items.filter(x => x.category === 'candles' && x.date.length > 10 && weekdayOfISO(x.date) === 5)
                           .map(x => new Date(x.date));
      const havdalah = items.filter(x => x.category === 'havdalah' && x.date.length > 10)
                            .map(x => new Date(x.date));
      if (candles.length && havdalah.length) {
        const c = candles[0];
        const h = havdalah.find(t => t > c);
        if (h && h.getTime() > now.getTime()) return { candles: c, havdalah: h, source: 'hebcal' };
      }
      day = addDays(day, 2); // that Shabbat is over — ask about the next one
    }
    throw new Error('no usable Hebcal data');
  }

  // NOAA-style sunset (UTC ms) for a civil date at lat/lon; null if the sun doesn't set.
  function sunsetMs(y, m, d, lat, lon) {
    const rad = Math.PI / 180;
    const n = Math.round(Date.UTC(y, m - 1, d, 12) / 864e5 + 2440587.5 - 2451545.0) + 0.0008;
    const Js = n - lon / 360;
    const M = ((357.5291 + 0.98560028 * Js) % 360 + 360) % 360;
    const Mr = M * rad;
    const C = 1.9148 * Math.sin(Mr) + 0.02 * Math.sin(2 * Mr) + 0.0003 * Math.sin(3 * Mr);
    const L = ((M + C + 180 + 102.9372) % 360) * rad;
    const Jt = 2451545 + Js + 0.0053 * Math.sin(Mr) - 0.0069 * Math.sin(2 * L);
    const sd = Math.sin(L) * Math.sin(23.4397 * rad);
    const cd = Math.cos(Math.asin(sd));
    const cw = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * cd);
    if (cw < -1 || cw > 1) return null;
    const w = Math.acos(cw) / rad;
    return (Jt + w / 360 - 2440587.5) * 864e5;
  }

  function localWindow(loc, now) {
    const today = tzDateParts(now, loc.tz);
    for (let k = -6; k <= 14; k++) {
      const fri = addDays(today, k);
      if (fri.wd !== 5) continue;
      const sat = addDays(fri, 1);
      const fs = sunsetMs(fri.y, fri.m, fri.d, loc.lat, loc.lon);
      const ss = sunsetMs(sat.y, sat.m, sat.d, loc.lat, loc.lon);
      if (fs == null || ss == null) continue;
      const c = new Date(fs - CANDLE_MIN * 60000);
      const h = new Date(ss + HAVDALAH_FALLBACK_MIN * 60000);
      if (h.getTime() > now.getTime()) return { candles: c, havdalah: h, source: 'local' };
    }
    return null;
  }

  /* ---------- state & rendering ---------- */
  let loc = null, win = null, busy = false;

  const fmt = (date, tz) => new Intl.DateTimeFormat(undefined, {
    timeZone: tz, weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  }).format(date);
  const tzName = (date, tz) => {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(date).find(x => x.type === 'timeZoneName');
    return p ? p.value : tz;
  };

  function renderInfo() {
    $('where').textContent = loc ? loc.label : 'Location unavailable';
    if (!win) { $('when').textContent = ''; return; }
    $('when').textContent =
      `Candle lighting ${fmt(win.candles, loc.tz)}  ·  Havdalah ${fmt(win.havdalah, loc.tz)}  (${tzName(win.candles, loc.tz)})`;
    const how = { ip: 'Location estimated from your IP address.',
                  device: 'Location from your device.', url: 'Location set in the page URL.' }[loc.method];
    const src = win.source === 'hebcal'
      ? `Times from Hebcal.com, candles ${CANDLE_MIN} min before sunset.`
      : `Approximate times computed from sunset (candles −${CANDLE_MIN} min, havdalah +${HAVDALAH_FALLBACK_MIN} min).`;
    $('source').textContent = `${how} ${src}`;
  }

  async function refresh() {
    if (busy || !loc) return;
    busy = true;
    const now = new Date();
    try { win = await hebcalWindow(loc, now); }
    catch (e) { win = localWindow(loc, now); }
    if (!win) {
      $('headline').textContent = 'Shabbat times unavailable here';
      $('source').textContent = 'The sun does not set at this location this week.';
    }
    renderInfo();
    busy = false;
  }

  function tick() {
    if (!win) return;
    const now = Date.now();
    const c = win.candles.getTime(), h = win.havdalah.getTime();
    if (now >= h) { win = null; blank(); refresh(); return; }
    const inShabbat = now >= c;
    document.documentElement.classList.toggle('shabbat', inShabbat);
    $('headline').textContent = inShabbat ? 'Shabbat Shalom · Shabbat ends in' : 'Shabbat begins in';

    let s = Math.max(0, Math.floor(((inShabbat ? h : c) - now) / 1000));
    const days = Math.floor(s / 86400); s %= 86400;
    const hours = Math.floor(s / 3600); s %= 3600;
    const minutes = Math.floor(s / 60);
    const seconds = s % 60;
    setGroup('days', days);
    setGroup('hours', hours);
    setGroup('minutes', minutes);
    setGroup('seconds', seconds);

    const dim = (now % 1000) >= 500;
    document.querySelectorAll('.colon').forEach(el => el.classList.toggle('dim', dim));
  }

  async function useLocation(l) {
    loc = l;
    win = null;
    blank();
    renderInfo();
    await refresh();
    tick();
  }

  $('geoBtn').addEventListener('click', async () => {
    $('source').textContent = 'Asking your device for its location…';
    try { await useLocation(await locateByDevice()); }
    catch (e) { $('source').textContent = 'Could not get your device location.'; renderInfo(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && loc && (!win || Date.now() >= win.havdalah.getTime())) refresh();
  });

  (async () => {
    const l = locateFromURL() || await locateByIP();
    if (l) {
      await useLocation(l);
    } else {
      $('where').textContent = 'We couldn’t estimate your location';
      $('source').textContent = 'Your network may block IP lookups.';
    }
    setInterval(tick, 100);
  })();
})();
</script>
</body>
</html>
